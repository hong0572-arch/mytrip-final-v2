workflows:
  ios-build:
    name: iOS App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build Web Application (Next.js)
        script: |
          npm run build
      - name: Synchronize Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          # Codemagic will build the Xcode workspace and output the .ipa bundle.
          # Note: This command automatically handles code signing if you set up the
          # Apple Developer Portal integration in the Codemagic UI.
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - joondehong@gmail.com
        notify:
          success: true
          failure: true
