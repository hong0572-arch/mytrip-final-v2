query listAllTrips @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  trips {
    id
    name
    destination
    startDate
    endDate
    budget
  }
}

query getMyTrips @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  trips(where: {ownerId: {eq_expr: "auth.uid"}}) {
    id
    name
    destination
    startDate
    endDate
    owner {
      displayName
    }
  }
}

mutation createTrip($name: String!, $destination: String!, $startDate: Date!, $endDate: Date!, $budget: Float) @auth(level: USER) {
  trip_insert(data: {
    name: $name,
    destination: $destination,
    startDate: $startDate,
    endDate: $endDate,
    budget: $budget,
    ownerId_expr: "auth.uid",
    createdAt_expr: "request.time"
  })
}

mutation updateTripDetails($id: UUID!, $name: String, $destination: String, $startDate: Date, $endDate: Date, $budget: Float) @auth(level: USER) {
  trip_update(
    key: {id: $id},
    data: {
      name: $name,
      destination: $destination,
      startDate: $startDate,
      endDate: $endDate,
      budget: $budget
    },
    where: {ownerId: {eq_expr: "auth.uid"}}
  )
}